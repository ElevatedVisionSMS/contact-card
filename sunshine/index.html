<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Javier Cabrera — Sunshine Tire Recycling</title>
<meta name="description" content="Sunshine Tire Recycling — Miami's 24/7 tire disposal experts.">
<meta name="theme-color" content="#000000">
<meta property="og:title" content="Sunshine Tire Recycling">

<style>
  :root{
    --ground:#000000;      /* logo background — pure black */
    --orange:#E2571F;      /* SUNSHINE wordmark */
    --gold:#F5B301;        /* sun rays */
    --bone:#EDEAE4;        /* primary text */
    --ash:#8C8C8C;         /* secondary text, tire tread grey */
    --edge:#242424;        /* borders */
    --panel:#0D0D0D;       /* row background */
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{background:var(--ground);}
  body{
    min-height:100dvh;color:var(--bone);
    font-family:"Inter","Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;
    display:flex;justify-content:center;
    padding:36px 22px calc(40px + env(safe-area-inset-bottom));
    -webkit-font-smoothing:antialiased;
  }
  .card{width:100%;max-width:400px;display:flex;flex-direction:column;align-items:center;text-align:center;}

  .logo{width:300px;max-width:92%;height:auto;display:block;margin-bottom:4px;}

  .tagline{
    margin-top:6px;font-size:17px;line-height:1.4;font-weight:600;color:var(--gold);
  }
  .rule{width:56px;height:3px;background:var(--orange);border-radius:2px;margin:20px 0 16px;}

  .name{font-size:23px;font-weight:700;letter-spacing:.01em;}
  .org{margin-top:6px;font-size:12px;letter-spacing:.13em;text-transform:uppercase;color:var(--ash);}

  .save{
    display:block;width:100%;margin-top:26px;padding:17px 20px;
    background:var(--orange);color:#fff;border-radius:12px;
    text-decoration:none;text-align:center;font-size:16px;font-weight:700;
  }
  .save:active{opacity:.85;}

  .links{width:100%;margin-top:12px;display:flex;flex-direction:column;gap:10px;}
  .links a{
    display:flex;align-items:center;gap:13px;text-align:left;
    padding:15px 16px;border:1px solid var(--edge);border-radius:12px;
    color:var(--bone);text-decoration:none;font-size:15px;font-weight:500;
    word-break:break-word;background:var(--panel);
  }
  .links a:active{background:#171717;}
  .ic{flex:0 0 20px;height:20px;display:flex;align-items:center;justify-content:center;color:var(--gold);}
  .ic svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}
  .lbl{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ash);font-weight:600;margin-bottom:2px;}

  .hours{
    width:100%;margin-top:24px;padding:16px 18px;
    border:1px solid var(--edge);border-radius:12px;background:var(--panel);
  }
  .hours strong{display:block;font-size:22px;color:var(--gold);letter-spacing:.02em;}
  .hours span{display:block;margin-top:4px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ash);}

  footer{
    margin-top:24px;padding-top:16px;border-top:1px solid var(--edge);width:100%;
    font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ash);
  }
</style>
</head>
<body>
